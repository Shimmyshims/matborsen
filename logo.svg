<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bakgrunn -->
  <rect width="44" height="44" rx="11" fill="#166534"/>

  <!-- Gaffel-M: ytre tinder (M-topper, høye) -->
  <line x1="11" y1="9"  x2="11" y2="22" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="33" y1="9"  x2="33" y2="22" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Gaffel-M: indre tinder (M-dal, kortere) -->
  <line x1="18" y1="15" x2="18" y2="22" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="26" y1="15" x2="26" y2="22" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Hals: konvergerer til skaft -->
  <path d="M11 22 C11 28 18 29 22 29 C26 29 33 28 33 22"
        stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Skaft -->
  <line x1="22" y1="29" x2="22" y2="37" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Mørkegrønn aksent-prikk -->
  <circle cx="22" cy="37" r="2.8" fill="#6ee7a0"/>
</svg>
